<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 &mdash; Page Not Found | Omer Muneer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="The requested page could not be found." />

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow: rgba(184, 69, 42, 0.15);
      --accent: #b8452a;
      --accent-light: #e06847;
      --accent-glow: rgba(184, 69, 42, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 80% 80%, rgba(30, 58, 138, 0.12), transparent);
    }

    /* Ambient cursor glow follower */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 650px;
      height: 650px;
      margin-left: -325px;
      margin-top: -325px;
      border-radius: 50%;
      background: radial-gradient(
        circle closest-side,
        rgba(224, 104, 71, 0.28) 0%,
        rgba(184, 69, 42, 0.18) 40%,
        rgba(184, 69, 42, 0.06) 70%,
        transparent 100%
      );
      filter: blur(48px);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.5s ease-out;
      will-change: transform, opacity;
    }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      text-align: center;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.7), 0 0 35px var(--card-glow);
    }

    .badge-404 {
      display: inline-block;
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-light), #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      font-family: Georgia, serif;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.65rem;
      color: #ffffff;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px var(--accent-glow);
      filter: brightness(1.08);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s ease;
    }

    .social-link:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <div class="container">
    <div class="card">
      <div class="badge-404">404</div>

      <h1>Page Not Found</h1>
      <p class="subtitle">
        The link you followed might be broken, or the page may have been moved or removed.
      </p>

      <div class="btn-group">
        <a href="https://oomer.dev/" class="btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Go to Portfolio
        </a>
        <button onclick="window.history.back()" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go Back
        </button>
      </div>

      <div class="social-links">
        <a class="social-link" href="https://github.com/omrzgit" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
        <a class="social-link" href="https://linkedin.com/in/omermuneer" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          LinkedIn
        </a>
        <a class="social-link" href="mailto:work4omer@gmail.com">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          Email
        </a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const glow = document.getElementById('cursor-glow');
      if (!glow) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let currentX = mouseX;
      let currentY = mouseY;
      let isVisible = false;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!isVisible) {
          isVisible = true;
          glow.style.opacity = '1';
        }
      });

      document.addEventListener('mouseleave', () => {
        isVisible = false;
        glow.style.opacity = '0';
      });

      function render() {
        // Smooth mushy trailing interpolation (lerp factor 0.08)
        currentX += (mouseX - currentX) * 0.08;
        currentY += (mouseY - currentY) * 0.08;
        glow.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
